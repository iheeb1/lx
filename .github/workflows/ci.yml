name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -timeout 20m ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o lx ./cmd/lx && ./lx version
      - name: cross-compile
        if: runner.os == 'Linux'
        run: |
          for p in windows/amd64 windows/arm64 linux/arm64 darwin/amd64; do
            echo "build $p"
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/lx || exit 1
          done
      - name: no network code
        if: runner.os == 'Linux'
        run: make nonet
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh

  install-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: release build (6 platforms, SHA256SUMS)
        if: runner.os == 'Linux'
        run: make dist
      - name: install.sh end to end
        run: make install-test
